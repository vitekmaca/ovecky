<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Počítání oveček</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 40%, #2d1b69 100%);
    color: #e8e0ff;
    font-family: 'Georgia', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow: hidden;
  }

  .stars {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 2.5rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 0.3rem;
    text-shadow: 0 0 20px rgba(180,160,255,0.8);
  }

  .sheep-emoji { font-size: 2.5rem; }

  .subtitle {
    color: rgba(232,224,255,0.6);
    font-size: 0.9rem;
    margin-bottom: 2rem;
  }

  .field {
    margin-bottom: 1.2rem;
    text-align: left;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: rgba(232,224,255,0.7);
    margin-bottom: 0.4rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  select, input[type="number"] {
    width: 100%;
    padding: 0.75rem 1rem;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    color: #e8e0ff;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  select:focus, input[type="number"]:focus {
    border-color: rgba(180,160,255,0.7);
  }

  select option { background: #1a1a4e; }

  .speed-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.2rem;
  }

  .speed-btn {
    flex: 1;
    padding: 0.5rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: rgba(232,224,255,0.7);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .speed-btn.active {
    background: rgba(180,160,255,0.25);
    border-color: rgba(180,160,255,0.6);
    color: #e8e0ff;
  }

  .btn {
    width: 100%;
    padding: 1rem;
    border: none;
    border-radius: 14px;
    font-size: 1.1rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 0.5rem;
  }

  .btn-start {
    background: linear-gradient(135deg, #7c5cbf, #a878e8);
    color: white;
    box-shadow: 0 4px 20px rgba(168,120,232,0.4);
  }

  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(168,120,232,0.5); }
  .btn-start:active { transform: translateY(0); }

  .btn-stop {
    background: rgba(255,100,100,0.2);
    border: 1px solid rgba(255,100,100,0.4);
    color: #ffaaaa;
    display: none;
  }

  .btn-stop:hover { background: rgba(255,100,100,0.3); }

  .playback {
    display: none;
    margin-top: 2rem;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .current-sheep {
    font-size: 4rem;
    margin-bottom: 0.3rem;
    filter: drop-shadow(0 0 20px rgba(255,255,200,0.6));
  }

  .current-text {
    font-size: 1.4rem;
    color: rgba(232,224,255,0.9);
    min-height: 2rem;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    margin-top: 1.2rem;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #7c5cbf, #a878e8);
    border-radius: 3px;
    transition: width 0.5s ease;
    width: 0%;
  }

  .done-msg {
    display: none;
    margin-top: 1rem;
    color: rgba(232,224,255,0.6);
    font-size: 0.9rem;
    font-style: italic;
  }

  .limit-note {
    font-size: 0.75rem;
    color: rgba(232,224,255,0.4);
    margin-top: 0.3rem;
  }

  .moon {
    position: fixed;
    top: 3rem;
    right: 3rem;
    width: 80px;
    height: 80px;
    background: radial-gradient(circle at 35% 35%, #fffde7, #ffd54f);
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(255,213,79,0.4), 0 0 80px rgba(255,213,79,0.2);
    z-index: 0;
  }

  .sheep-parade {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 80px;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .parade-sheep {
    position: absolute;
    font-size: 2rem;
    bottom: 10px;
    animation: walkRight linear infinite;
    opacity: 0.4;
  }

  @keyframes walkRight {
    from { transform: translateX(-80px); }
    to { transform: translateX(calc(100vw + 80px)); }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="moon"></div>
<div class="sheep-parade" id="parade"></div>

<div class="card">
  <div class="sheep-emoji">🐑</div>
  <h1 id="title">Počítání oveček</h1>
  <p class="subtitle" id="subtitle">Usni klidně a sni...</p>

  <div class="field">
    <label>Jazyk / Sprache</label>
    <select id="lang" onchange="applyLang()">
      <option value="cs">🇨🇿 Čeština</option>
      <option value="de">🇩🇪 Deutsch</option>
    </select>
  </div>

  <div class="field">
    <label id="lbl-count">Počet oveček</label>
    <input type="number" id="count" value="20" min="1" max="30">
    <div class="limit-note" id="limit-note">Předgenerováno 1–30 oveček</div>
  </div>

  <div class="field">
    <label id="lbl-speed">Pauza mezi ovečkami</label>
    <div class="speed-row">
      <button class="speed-btn" data-pause="6000" onclick="setSpeed(this)">🐢 Pomalu</button>
      <button class="speed-btn active" data-pause="3500" onclick="setSpeed(this)">🐑 Normálně</button>
      <button class="speed-btn" data-pause="2000" onclick="setSpeed(this)">🐇 Rychle</button>
    </div>
  </div>

  <button class="btn btn-start" id="btnStart" onclick="startCounting()">▶ Začít počítat</button>
  <button class="btn btn-stop" id="btnStop" onclick="stopCounting()">⏹ Zastavit</button>

  <div class="playback" id="playback">
    <div class="current-sheep" id="sheepEmoji">🐑</div>
    <div class="current-text" id="currentText"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="done-msg" id="doneMsg">😴 Sladké sny... / Süße Träume...</div>
</div>

<script>
const TEXTS = {
  cs: {
    title: 'Počítání oveček',
    subtitle: 'Usni klidně a sni...',
    lblCount: 'Počet oveček',
    lblSpeed: 'Pauza mezi ovečkami',
    startBtn: '▶ Začít počítat',
    limitNote: 'Předgenerováno 1–30 oveček',
    labels: ['🐢 Pomalu','🐑 Normálně','🐇 Rychle'],
    sheep: ['jedna ovečka','dvě ovečky','tři ovečky','čtyři ovečky','pět oveček',
            'šest oveček','sedm oveček','osm oveček','devět oveček','deset oveček',
            'jedenáct oveček','dvanáct oveček','třináct oveček','čtrnáct oveček','patnáct oveček',
            'šestnáct oveček','sedmnáct oveček','osmnáct oveček','devatenáct oveček','dvacet oveček',
            'dvacet jedna oveček','dvacet dvě ovečky','dvacet tři ovečky','dvacet čtyři ovečky','dvacet pět oveček',
            'dvacet šest oveček','dvacet sedm oveček','dvacet osm oveček','dvacet devět oveček','třicet oveček'],
    dir: 'audio_cs',
  },
  de: {
    title: 'Schäfchen zählen',
    subtitle: 'Schlaf gut und träum schön...',
    lblCount: 'Anzahl Schäfchen',
    lblSpeed: 'Pause zwischen Schäfchen',
    startBtn: '▶ Zählen beginnen',
    limitNote: 'Vorerzeugt: 1–30 Schäfchen',
    labels: ['🐢 Langsam','🐑 Normal','🐇 Schnell'],
    sheep: ['ein Schäfchen','zwei Schäfchen','drei Schäfchen','vier Schäfchen','fünf Schäfchen',
            'sechs Schäfchen','sieben Schäfchen','acht Schäfchen','neun Schäfchen','zehn Schäfchen',
            'elf Schäfchen','zwölf Schäfchen','dreizehn Schäfchen','vierzehn Schäfchen','fünfzehn Schäfchen',
            'sechzehn Schäfchen','siebzehn Schäfchen','achtzehn Schäfchen','neunzehn Schäfchen','zwanzig Schäfchen',
            'einundzwanzig Schäfchen','zweiundzwanzig Schäfchen','dreiundzwanzig Schäfchen','vierundzwanzig Schäfchen','fünfundzwanzig Schäfchen',
            'sechsundzwanzig Schäfchen','siebenundzwanzig Schäfchen','achtundzwanzig Schäfchen','neunundzwanzig Schäfchen','dreißig Schäfchen'],
    dir: 'audio_de',
  },
};

// Stars
(function() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s;`;
    c.appendChild(s);
  }
})();

// Parade
(function() {
  const c = document.getElementById('parade');
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div');
    s.className = 'parade-sheep';
    s.textContent = '🐑';
    const dur = 18 + Math.random() * 14;
    s.style.cssText = `animation-duration:${dur}s;animation-delay:-${Math.random()*dur}s;font-size:${1.5+Math.random()}rem;`;
    c.appendChild(s);
  }
})();

let pauseMs = 3500;
function setSpeed(btn) {
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  pauseMs = parseInt(btn.dataset.pause);
}

function applyLang() {
  const lang = document.getElementById('lang').value;
  const d = TEXTS[lang];
  document.getElementById('title').textContent = d.title;
  document.getElementById('subtitle').textContent = d.subtitle;
  document.getElementById('lbl-count').textContent = d.lblCount;
  document.getElementById('lbl-speed').textContent = d.lblSpeed;
  document.getElementById('btnStart').textContent = d.startBtn;
  document.getElementById('limit-note').textContent = d.limitNote;
  const btns = document.querySelectorAll('.speed-btn');
  d.labels.forEach((l, i) => btns[i].textContent = l);
}

let running = false;
let stopFlag = false;
let currentAudio = null;
let sleepTimer = null;

function playAudio(src) {
  return new Promise(resolve => {
    const audio = new Audio(src);
    currentAudio = audio;
    audio.onended = resolve;
    audio.onerror = resolve;
    audio.play().catch(resolve);
  });
}

function sleep(ms) {
  return new Promise(resolve => {
    sleepTimer = setTimeout(resolve, ms);
  });
}

async function startCounting() {
  if (running) return;
  const lang = document.getElementById('lang').value;
  const d = TEXTS[lang];
  const total = Math.min(parseInt(document.getElementById('count').value) || 20, 30);

  running = true;
  stopFlag = false;

  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnStop').style.display = 'block';
  document.getElementById('playback').style.display = 'block';
  document.getElementById('doneMsg').style.display = 'none';
  document.getElementById('progressFill').style.width = '0%';

  const emojis = ['🐑','🐏','🐑','🐑','🐏'];

  for (let i = 1; i <= total; i++) {
    if (stopFlag) break;

    document.getElementById('currentText').textContent = d.sheep[i - 1];
    document.getElementById('progressFill').style.width = `${(i / total) * 100}%`;
    document.getElementById('sheepEmoji').textContent = emojis[i % emojis.length];

    await playAudio(`${d.dir}/${i}.mp3`);
    if (stopFlag) break;

    await sleep(pauseMs);
  }

  running = false;
  document.getElementById('btnStart').style.display = 'block';
  document.getElementById('btnStop').style.display = 'none';

  if (!stopFlag) {
    document.getElementById('doneMsg').style.display = 'block';
    document.getElementById('currentText').textContent = '😴 zzz...';
    document.getElementById('progressFill').style.width = '100%';
  }
}

function stopCounting() {
  stopFlag = true;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
  running = false;
  document.getElementById('btnStart').style.display = 'block';
  document.getElementById('btnStop').style.display = 'none';
}

applyLang();
</script>
</body>
</html>
